name: Narration TTS
# 발표 영상 내레이션: macOS 내장 한국어 음성(Yuna)으로 문장별 음성 파일을 만든다.
on:
  workflow_dispatch:

jobs:
  tts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Korean voices
        run: say -v '?' | grep -i -E "ko_KR|yuna" || true
      - name: Synthesize
        run: |
          # 자연스러운 Yuna를 우선 (Eddy·Flo 등은 기계음에 가까움)
          VOICE=$(say -v '?' | grep -i "ko_KR" | grep -i -E "yuna.*(premium|enhanced)" | head -1 | sed -E 's/ +ko_KR.*//')
          [ -z "$VOICE" ] && VOICE=$(say -v '?' | grep -E "^Yuna " | head -1 | sed -E 's/ +ko_KR.*//')
          [ -z "$VOICE" ] && VOICE=$(say -v '?' | grep -i "ko_KR" | head -1 | sed -E 's/ +ko_KR.*//')
          [ -z "$VOICE" ] && { echo "::error::no Korean voice"; exit 1; }
          echo "voice: $VOICE"
          echo "$VOICE" > voice.txt
          mkdir -p out
          while IFS=$'\t' read -r id text; do
            [ -z "$id" ] && continue
            say -v "$VOICE" -o "out/$id.aiff" -- "$text"
            afconvert -f WAVE -d LEI16@24000 -c 1 "out/$id.aiff" "out/$id.wav"
            rm "out/$id.aiff"
          done < .github/tts/lines.tsv
          cp voice.txt out/
          ls out | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: narration
          path: out/
