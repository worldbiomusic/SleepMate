name: Narration TTS
# 발표 영상 내레이션: macOS 내장 한국어 음성(Yuna)으로 문장별 음성 파일을 만든다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Korean voices
        run: say -v '?' | grep -i -E "ko_KR|yuna" || true
      - name: Synthesize
        run: |
          # 자연스러운 Yuna를 우선 (Eddy·Flo 등은 기계음에 가까움)
          VOICE=$(say -v '?' | grep -i "ko_KR" | grep -i -E "yuna.*(premium|enhanced)" | head -1 | sed -E 's/ +ko_KR.*//')
          [ -z "$VOICE" ] && VOICE=$(say -v '?' | grep -E "^Yuna " | head -1 | sed -E 's/ +ko_KR.*//')
          [ -z "$VOICE" ] && VOICE=$(say -v '?' | grep -i "ko_KR" | head -1 | sed -E 's/ +ko_KR.*//')
          [ -z "$VOICE" ] && { echo "::error::no Korean voice"; exit 1; }
          echo "voice: $VOICE"
          echo "$VOICE" > voice.txt
          mkdir -p out
          while IFS=$'\t' read -r id text; do
            [ -z "$id" ] && continue
            say -v "$VOICE" -o "out/$id.aiff" -- "$text"
            afconvert -f WAVE -d LEI16@24000 -c 1 "out/$id.aiff" "out/$id.wav"
            rm "out/$id.aiff"
          done < .github/tts/lines.tsv
          cp voice.txt out/
          ls out | wc -l
      # 결과는 narration 브랜치에 올린다 (아티팩트 저장소는 Claude 작업 환경에서 막혀 있음)
      - name: Publish to narration branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q && git checkout -q -b narration
          git add . && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "narration"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" narration
