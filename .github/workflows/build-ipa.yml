name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - "SleepMate/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:    # Actions 탭에서 수동 실행 가능

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # repository secrets → 앱 기본 키 (값은 로그에 나오지 않음, 저장소에는 커밋되지 않음)
      - name: Embed default API keys
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python3 .github/scripts/embed_keys.py SleepMate/Sources/AI/BuiltInKeys.swift

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project SleepMate.xcodeproj \
            -scheme SleepMate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log   # .app 폴더는 실패해도 생기므로 로그로 판정
          test -d build/Build/Products/Release-iphoneos/SleepMate.app

      # 서명 없이 빌드하면 HealthKit 권한(entitlements)이 앱에 들어가지 않는다.
      # ad-hoc 서명으로 entitlements를 넣어 두면 Sideloadly가 재서명할 때 그대로 가져간다.
      - name: Embed entitlements (ad-hoc sign)
        run: |
          APP=build/Build/Products/Release-iphoneos/SleepMate.app
          # 안쪽(워치 앱)부터 서명해야 바깥 서명이 깨지지 않는다
          if [ -d "$APP/Watch/SleepMateWatch.app" ]; then
            codesign --force --sign - --timestamp=none "$APP/Watch/SleepMateWatch.app"
            echo "워치 앱 포함:"; ls "$APP/Watch"
            plutil -p "$APP/Watch/SleepMateWatch.app/Info.plist" | grep -E "WKApplication|WKCompanion|CFBundleIdentifier"
          else
            echo "::warning::워치 앱이 IPA에 포함되지 않았습니다"
          fi
          codesign --force --sign - --timestamp=none \
            --entitlements SleepMate/Resources/SleepMate.entitlements "$APP"
          codesign -d --entitlements :- "$APP"

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/SleepMate.app dist/Payload/
          cd dist && zip -qry SleepMate.ipa Payload
          ls -lh SleepMate.ipa

      # IPA 안에 기본 키가 들어 있으므로, IPA_PASSWORD 시크릿이 있으면 암호 zip으로 감싼다.
      # (public 저장소의 Actions 아티팩트는 로그인한 GitHub 사용자 누구나 받을 수 있음)
      - name: Protect IPA with password (if IPA_PASSWORD is set)
        env:
          IPA_PASSWORD: ${{ secrets.IPA_PASSWORD }}
        run: |
          cd dist
          if [ -n "$IPA_PASSWORD" ]; then
            zip -q -P "$IPA_PASSWORD" SleepMate-ipa.zip SleepMate.ipa && rm SleepMate.ipa
            echo "IPA를 암호 zip으로 감쌌습니다."
          else
            echo "::warning::IPA_PASSWORD 시크릿이 없어 IPA를 그대로 올립니다 (기본 API 키 포함)."
          fi
          ls -lh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SleepMate-ipa-${{ github.run_number }}
          path: |
            dist/SleepMate.ipa
            dist/SleepMate-ipa.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
