name: Simulator screenshots

# iOS 시뮬레이터에서 앱을 데모 데이터로 실행해 화면을 캡처하고
# `screenshots` 브랜치에 올린다. (맥 없이 UI 미리보기용)
on:
  push:
    branches: [main]
    paths:
      - "SleepMate/**"
      - "project.yml"
      - ".github/workflows/screenshots.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick & boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS")) | .value[]
             | select(.name | test("^iPhone [0-9]+ Pro$"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            UDID=$(xcrun simctl list devices available -j | jq -r '
              [.devices | to_entries[] | select(.key | test("iOS")) | .value[]
               | select(.name | startswith("iPhone"))] | last | .udid')
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project SleepMate.xcodeproj \
            -scheme SleepMate \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log   # .app 폴더는 실패해도 생기므로 로그로 판정
          test -d build/Build/Products/Debug-iphonesimulator/SleepMate.app

      - name: Capture screenshots
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/SleepMate.app
          BID=com.jeonghanlee.sleepmate
          mkdir -p shots logs
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 || true

          export SIMCTL_CHILD_TZ=Asia/Seoul      # 앱을 한국 시간대로 실행

          shoot () {   # $1=file name, rest=launch args
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true
            xcrun simctl launch --stdout="$PWD/logs/$name.txt" --stderr="$PWD/logs/$name.err" \
              "$UDID" "$BID" -AppleLanguages "(ko)" -AppleLocale ko_KR "$@"
            sleep 5
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }

          xcrun simctl ui "$UDID" appearance light

          # ---- 셀프 테스트 (결과는 마지막 단계에서 판정) ----
          shoot 0-selftest -runSelfTests YES -demoScreen selftest
          for i in $(seq 1 60); do      # 느린 러너에서도 끝날 때까지 기다림
            grep -q "\[SelfTest\] SUMMARY" logs/0-selftest.err 2>/dev/null && break
            sleep 1
          done
          xcrun simctl io "$UDID" screenshot "shots/0-selftest.png"
          grep "\[SelfTest\]" logs/0-selftest.err > selftest.log || true
          tail -5 logs/0-selftest.err || true
          grep -E "FAIL|SUMMARY" selftest.log || true

          # ---- 새 구조: 지금 · 기록 · 설정 ----
          shoot n1-now-morning   -testSleep short -testToday morningFocus -testClock morning -demoTab now
          shoot n2-now-day       -testSleep short -testToday morningFocus -testClock day -demoTab now
          shoot n3-now-night     -testSleep good -testClock evening -demoTab now
          shoot n4-now-start     -demoTab now
          shoot n5-why           -testSleep good -testClock evening -demoTab now -demoWhy YES
          shoot n6-records       -testSleep short -testClock morning -demoTab records
          shoot n7-settings      -testSleep good -demoTab settings
          shoot s1-strategies    -demoData YES -demoScreen strategies
          shoot s2-strategy      -demoData YES -demoScreen strategy
          shoot s3-interview     -demoData YES -demoScreen interview

          # ---- 테스트 모드 (더미 데이터) ----
          shoot t1-short-today   -testSleep short -testToday morningFocus -testClock morning -demoTab today
          shoot t2-short-home    -testSleep short -testToday morningFocus -testClock morning -demoTab home
          shoot t3-nap-home      -testSleep withNap -testClock morning -demoTab home
          shoot t4-empty-today   -testSleep empty -testClock morning -demoTab today
          shoot t5-evening       -testSleep good -testClock evening -demoTab winddown
          shoot t6-early-alarm   -testSleep good -testTomorrow early -demoTab alarm
          shoot t7-testlab       -testSleep short -demoScreen testlab
          shoot t12-memory       -testSleep good -testClock evening -demoScreen memory
          shoot t13-usage-tonight -testSleep good -testClock evening -demoTab winddown
          shoot t14-usage-setup  -demoData YES -demoScreen usage
          shoot t8-sound         -testSleep good -testClock evening -demoScreen sound
          shoot t9-jev           -testSleep good -demoScreen jev
          shoot t10-notion       -testSleep good -demoScreen notion

          shoot 1-first-launch -demoData YES -demoScreen first
          shoot 2-home     -demoData YES -demoScreen home
          shoot 3-detail   -demoData YES -demoScreen detail
          shoot 4-guide    -demoData YES -demoScreen guide
          shoot 4b-coach   -demoData YES -demoScreen coach
          shoot 4c-coach-settings -demoData YES -demoScreen settings

          # 단축어가 보내는 것과 같은 형식으로 sleepmate://import 처리 경로를 검증
          # (simctl openurl은 시뮬레이터 확인창이 떠서 CI에서 누를 수 없으므로 실행 인자로 전달)
          URL=$(TZ=Asia/Seoul python3 .github/scripts/sample_shortcut_text.py)
          echo "URL length: ${#URL}"
          shoot 5-url-import -testImportURL "$URL"
          # 앱을 껐다 켜도 기록이 남아 있는지 (캐시)
          shoot 6-after-relaunch
          shoot 6b-coach-after-import -demoScreen coach
          echo "----- app log: 5-url-import -----";    cat logs/5-url-import.err || true
          echo "----- app log: 6-after-relaunch -----"; cat logs/6-after-relaunch.err || true
          # URL 가져오기 결과가 앱 저장소(캐시)에 실제로 남았는지 확인
          DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data)
          CACHE="$DATA/Library/Application Support/sleep_cache.json"
          python3 - "$CACHE" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1]))
          segs = c["segments"]
          print(f"cache: {len(segs)} segments, source={c.get('lastSource')}")
          assert len(segs) == 13, "expected 13 segments (1 malformed line skipped)"
          PY

          # 시나리오별 탭
          shoot 8-tab-today     -demoData YES -demoTab today
          shoot 9-tab-winddown  -demoData YES -demoTab winddown
          shoot 10-tab-alarm    -demoData YES -demoTab alarm
          shoot 11-tab-settings -demoData YES -demoTab settings
          shoot 13-tab-guide -demoData YES -demoTab guide
          for n in 2 3 4 5 6 7 8; do
            shoot 13-guide-$n -demoData YES -demoTab guide -guideSection $n
          done
          shoot 12-report       -demoData YES -demoScreen report

          xcrun simctl ui "$UDID" appearance dark
          shoot 7-home-dark -demoData YES -demoScreen home
          ls -l shots

      - name: Self-test result
        if: always()
        run: |
          test -f selftest.log || { echo "셀프 테스트 로그 없음"; exit 1; }
          cat selftest.log
          grep -q "SUMMARY" selftest.log || { echo "셀프 테스트가 끝나지 않음"; exit 1; }
          if grep -q "\[SelfTest\] FAIL" selftest.log; then echo "실패한 셀프 테스트가 있습니다"; exit 1; fi

      - name: Publish to `screenshots` branch
        if: always() && hashFiles('shots/*.png') != ''
        run: |
          cp -R shots /tmp/shots
          cp selftest.log /tmp/shots/selftest.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rq --cached . && git clean -fdq -e build
          rm -rf build
          cp /tmp/shots/*.png .
          printf '# Simulator screenshots\n\nCommit: %s\n\n' "$GITHUB_SHA" > README.md
          for f in *.png; do printf '### %s\n<img src="%s" width="300">\n\n' "$f" "$f" >> README.md; done
          cp /tmp/shots/selftest.log . 2>/dev/null || true
          git add *.png README.md
          git add selftest.log 2>/dev/null || true
          git commit -qm "Screenshots for $GITHUB_SHA"
          git push -f origin screenshots

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-sim-log
          path: xcodebuild.log
