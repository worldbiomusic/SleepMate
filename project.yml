name: SleepMate

options:
  bundleIdPrefix: com.jeonghanlee
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SleepMate:
    type: application
    platform: iOS
    sources:
      - path: SleepMate/Sources
      - path: SleepMate/Shared
      - path: SleepMate/GuideImages
        buildPhase: resources
    dependencies:
      # 애플워치 앱을 아이폰 앱 안(Watch 폴더)에 넣는다 → Sideloadly로 같이 설치
      - target: SleepMateWatch
        embed: true
        codeSign: false
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jeonghanlee.sleepmate
        TARGETED_DEVICE_FAMILY: "1"          # iPhone 전용
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: SleepMate/Resources/Info.plist
      properties:
        CFBundleDisplayName: SleepMate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.jeonghanlee.sleepmate
            CFBundleURLSchemes: [sleepmate]
        LSApplicationQueriesSchemes: [shortcuts, youtube]
        NSCalendarsFullAccessUsageDescription: "오늘·내일 일정을 보고 행동 추천, 일정 조정안, 기상 알람 시각을 만들기 위해 사용합니다. 일정 변경은 사용자가 '적용'을 눌렀을 때만 합니다."
        NSCalendarsUsageDescription: "오늘·내일 일정을 보고 행동 추천과 기상 알람 시각을 만들기 위해 사용합니다."
        NSHealthShareUsageDescription: "Apple Watch가 기록한 수면 데이터를 읽어 수면 요약과 추천을 만드는 데 사용합니다."
    entitlements:
      path: SleepMate/Resources/SleepMate.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    scheme: {}

  SleepMateWatch:
    type: application
    platform: watchOS
    sources:
      - path: SleepMateWatch
      - path: SleepMate/Shared
    settings:
      base:
        PRODUCT_NAME: SleepMateWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.jeonghanlee.sleepmate.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SleepMate
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.jeonghanlee.sleepmate
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme: {}
